<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Token</title>
<!--
  ============================================================================
   YOUR TOKEN PAGE (made with vibekit)
   1. Open this file in any text editor (Notepad works).
   2. Paste your token address below where it says PASTE_YOUR_TOKEN_ADDRESS_HERE.
   3. Save, then double click the file to open it in your browser. Done.
   Everything else is optional.
  ============================================================================
-->
<script>
window.CONFIG = {
  // Your token address: open your token on vibe/vibe and copy it from the address bar
  // (https://testnet.vibevibe.fun/token/0x...  -> the 0x... part)
  token: "PASTE_YOUR_TOKEN_ADDRESS_HERE",

  // Optional. Leave "" and the page uses what's on chain.
  title: "",            // big title, e.g. "VIBER QUEST"
  tagline: "",          // one line under the title
  image: "",            // link to your logo: https://... or ipfs://...
  links: { website: "", x: "", telegram: "", discord: "" },   // buttons, "" hides one

  accent: "#dff902",    // main color
  buyBox: true,         // let visitors buy right here with their wallet (testnet, ETH-paired tokens)
};
</script>
<!-- ======================= no need to edit below this line ======================= -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--accent:#dff902;--bg:#06070a;--panel:#101318;--line:#1f242c;--g0:#f2f4f3;--g1:#aab2bb;--g2:#6c7580;--up:#4cd68a;--dn:#ff7a6b}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--g0);font:16px/1.5 "Space Grotesk",system-ui,sans-serif;min-height:100vh}
  body::before{content:"";position:fixed;inset:-30% -10% auto;height:70vh;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 22%,transparent),transparent);pointer-events:none;z-index:-1}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 18px 60px}
  .mono{font-family:"JetBrains Mono",monospace}
  .hero{display:flex;gap:26px;align-items:center;flex-wrap:wrap;padding:30px 0 26px}
  .logo{width:128px;height:128px;border-radius:28px;background:var(--panel);border:1px solid var(--line);object-fit:cover;display:grid;place-items:center;font-size:44px;font-weight:700;color:var(--accent);flex:none}
  h1{font-size:clamp(40px,7vw,76px);line-height:.95;letter-spacing:-.02em}
  .sym{display:inline-block;margin-top:10px;font-family:"JetBrains Mono",monospace;color:var(--accent);font-size:15px}
  .tag{color:var(--g1);margin-top:8px;max-width:620px}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--g0);text-decoration:none;font:600 15px "Space Grotesk";cursor:pointer}
  .btn:hover{border-color:var(--accent)} .btn.main{background:var(--accent);color:#000;border-color:var(--accent)} .btn:disabled{opacity:.5;cursor:default}
  .ca{margin-top:14px;font-size:13px;color:var(--g2);cursor:pointer} .ca b{color:var(--g1);font-weight:400}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:10px 0 18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
  .k{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.12em;color:var(--g2);text-transform:uppercase}
  .v{font-size:28px;font-weight:700;margin-top:6px} .s{color:var(--g1);font-size:13px;margin-top:2px}
  .bar{height:10px;border-radius:99px;background:#1a1e25;overflow:hidden;margin-top:12px} .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
  .grid{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
  .buy{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .buy input{height:44px;width:150px;border-radius:12px;border:1px solid var(--line);background:#07080b;color:var(--g0);padding:0 14px;font:600 16px "JetBrains Mono"}
  .quote{color:var(--g1);font-size:14px;margin-top:10px;min-height:21px} .msg{font-size:14px;margin-top:8px;min-height:21px}
  .list{margin-top:10px} .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
  .row:first-child{border-top:0} .row .m{font-family:"JetBrains Mono",monospace;font-size:13px} .row .r{margin-left:auto;text-align:right}
  .row.new{animation:flash 1.5s ease-out} @keyframes flash{from{background:color-mix(in srgb,var(--accent) 18%,transparent)}to{background:transparent}}
  .pill{font:600 11px "JetBrains Mono";padding:3px 8px;border-radius:99px} .pill.buy{background:rgba(76,214,138,.14);color:var(--up)} .pill.sell{background:rgba(255,122,107,.14);color:var(--dn)}
  a{color:var(--accent)} .dim{color:var(--g2)}
  .err{margin-top:60px;padding:22px;border:1px solid var(--dn);border-radius:16px;background:rgba(255,122,107,.07)}
  footer{margin-top:40px;color:var(--g2);font-size:13px}
  @media (max-width:820px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="dim" style="margin-top:80px">Loading the token from Robinhood Chain…</p></div>
<script type="module">
/*VIBE_JS*/

const C = window.CONFIG, $ = id => document.getElementById(id), esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ipfs = u => u && u.startsWith("ipfs://") ? "https://ipfs.io/ipfs/" + u.slice(7) : u;
document.documentElement.style.setProperty("--accent", C.accent || "#dff902");

if (!/^0x[0-9a-fA-F]{40}$/.test(C.token || "")) {
  $("app").innerHTML = `<div class="err"><h2>Almost there</h2><p style="margin-top:8px">Open <b>index.html</b> in a text editor, paste your token address where it says <span class="mono">PASTE_YOUR_TOKEN_ADDRESS_HERE</span>, save and reload this page.</p>
    <p class="dim" style="margin-top:8px">Your token address is in the address bar on its vibe/vibe page: testnet.vibevibe.fun/token/<b>0x…</b></p></div>`;
  throw new Error("no token set");
}

let info;
try { info = await tokenInfo(C.token); }
catch (e) { $("app").innerHTML = `<div class="err"><h2>Could not load this token</h2><p style="margin-top:8px">${esc(e.message)}</p></div>`; throw e; }

const title = C.title || info.name, img = ipfs(C.image);
document.title = `${title} ($${info.symbol})`;
const linkBtn = (url, label) => url ? `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">${label}</a>` : "";
const showBuy = C.buyBox && info.pairIsEth && !info.complete;
$("app").innerHTML = `
  <div class="hero">
    ${img ? `<img class="logo" src="${esc(img)}" alt="">` : `<div class="logo">${esc(info.symbol.slice(0, 2))}</div>`}
    <div>
      <h1>${esc(title)}</h1><span class="sym">$${esc(info.symbol)}</span>
      ${C.tagline ? `<p class="tag">${esc(C.tagline)}</p>` : ""}
      <div class="btns"><a class="btn main" href="${tokenPage(info.token)}" target="_blank" rel="noopener">Buy on vibe/vibe ↗</a>
        ${linkBtn(C.links?.website, "Website")}${linkBtn(C.links?.x, "X")}${linkBtn(C.links?.telegram, "Telegram")}${linkBtn(C.links?.discord, "Discord")}
        <a class="btn" href="${EXPLORER}/token/${info.token}" target="_blank" rel="noopener">Explorer ↗</a></div>
      <p class="ca mono" id="ca" title="click to copy">CA <b>${info.token}</b></p>
    </div>
  </div>
  <div class="stats">
    <div class="card"><span class="k">Price</span><div class="v" id="price">–</div><div class="s">${esc(info.pairSymbol)} per token</div></div>
    <div class="card"><span class="k">${info.graduated ? "Graduated" : "To graduation"}</span><div class="v" id="prog">–</div><div class="bar"><i id="bar" style="width:0"></i></div></div>
    <div class="card"><span class="k">Tax right now</span><div class="v" id="tax">–</div><div class="s">${info.graduated ? "on pool trades" : "on curve trades"}</div></div>
    <div class="card"><span class="k">Holders</span><div class="v" id="holders">–</div><div class="s" id="lock">${info.graduated ? "transfers unlocked" : "transfers unlock at graduation"}</div></div>
  </div>
  <div class="grid">
    <div class="card"><span class="k">Live trades</span><div class="list" id="trades"><p class="dim" style="margin-top:8px">reading the chain…</p></div></div>
    <div>
      ${showBuy ? `<div class="card" style="margin-bottom:12px"><span class="k">Buy $${esc(info.symbol)}</span>
        <div class="buy"><input id="amt" value="0.01" inputmode="decimal"> <span class="dim">ETH</span><button class="btn main" id="go">Connect wallet</button></div>
        <div class="quote" id="quote"></div><div class="msg" id="msg"></div>
        <p class="dim" style="font-size:12px;margin-top:6px">Testnet ETH only. Need some? <a href="https://testnet.vibevibe.fun/faucet" target="_blank" rel="noopener">faucet</a></p></div>` : ""}
      <div class="card"><span class="k">Top holders</span><div class="list" id="top"><p class="dim" style="margin-top:8px">reading the explorer…</p></div></div>
    </div>
  </div>
  <footer>Robinhood Chain testnet. Nothing here has real value. Made with <a href="https://vibercheck.xyz/build" target="_blank" rel="noopener">vibekit</a>.</footer>`;

$("ca").onclick = () => navigator.clipboard.writeText(info.token).then(() => { $("ca").firstElementChild.textContent = "copied!"; setTimeout(() => $("ca").firstElementChild.textContent = info.token, 1200); });

async function refreshStats() {
  try { info = await tokenInfo(C.token); } catch (_) { return; }
  $("price").textContent = fmtPrice(info.price);
  $("prog").textContent = info.graduated ? "✓ 100%" : (info.progress * 100).toFixed(1) + "%";
  $("bar").style.width = Math.min(100, info.progress * 100) + "%";
  $("tax").textContent = info.taxPercent + "%";
}
const tradeRow = (t, fresh) => `<div class="row ${fresh ? "new" : ""}"><span class="pill ${t.side}">${t.side.toUpperCase()}</span>
  <a class="m" href="${EXPLORER}/address/${t.trader}" target="_blank" rel="noopener">${short(t.trader)}</a>
  <span class="r"><b>${fmt(t.tokens)}</b> ${esc(info.symbol)}<br><span class="dim m">${fmt(t.pair, 4)} ${esc(info.pairSymbol)} · ${t.time ? ago(t.time) : ""}</span></span></div>`;
let trades = [];
const drawTrades = fresh => { $("trades").innerHTML = trades.length ? trades.map((t, i) => tradeRow(t, fresh && i === 0)).join("") : '<p class="dim" style="margin-top:8px">no trades in the last hours. be the first!</p>'; };
async function loadHolders() {
  const [top, n] = await Promise.all([topHolders(info, 10).catch(() => []), holderCount(info.token)]);
  $("holders").textContent = n == null ? "–" : fmt(n, 0);
  $("top").innerHTML = top.map((h, i) => `<div class="row"><span class="dim m">${i + 1}</span><a class="m" href="${EXPLORER}/address/${h.address}" target="_blank" rel="noopener">${short(h.address)}</a>
    <span class="r"><b>${fmt(h.balance)}</b><br><span class="dim m">${h.percent.toFixed(2)}%</span></span></div>`).join("") || '<p class="dim" style="margin-top:8px">no holders yet</p>';
}
await refreshStats();
recentTrades(info, 12).then(t => { trades = t; drawTrades(false); }).catch(() => { $("trades").innerHTML = '<p class="dim">could not read trades right now</p>'; });
loadHolders();
watchTrades(info, t => { trades.unshift(t); trades = trades.slice(0, 12); drawTrades(true); refreshStats(); });
setInterval(refreshStats, 20000); setInterval(loadHolders, 60000);

if (showBuy) {
  let conn = null;
  const quote = async () => { const v = $("amt").value.trim(); if (!(Number(v) > 0)) { $("quote").textContent = ""; return; }
    try { const q = await quoteBuy(info, v); $("quote").innerHTML = `you get about <b>${fmt(q.tokens)}</b> ${esc(info.symbol)} · tax ${q.taxPercent}%`; } catch (_) { $("quote").textContent = ""; } };
  $("amt").oninput = () => { clearTimeout(quote.t); quote.t = setTimeout(quote, 300); }; quote();
  $("go").onclick = async () => {
    const msg = $("msg"); msg.style.color = ""; $("go").disabled = true;
    try {
      if (!conn) { conn = await connectWallet(); $("go").textContent = "Buy"; msg.textContent = "connected " + short(conn.account); return; }
      msg.textContent = "confirm in your wallet…";
      const hash = await buyWithEth(conn, info, $("amt").value.trim());
      msg.innerHTML = `bought! <a href="${EXPLORER}/tx/${hash}" target="_blank" rel="noopener">see the transaction ↗</a>`;
    } catch (e) { msg.style.color = "var(--dn)"; msg.textContent = (e.shortMessage || e.message || String(e)).slice(0, 160); }
    finally { $("go").disabled = false; }
  };
}
</script>
</body>
</html>
